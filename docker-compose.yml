version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: FloralProd
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password2
      POSTGRES_DB: test_floralprod
    ports:
      - "6432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    name: postgres_data